name: Sync Public Mirror

on:
  push:
    branches:
      - release

jobs:
  sync-public:
    # Only run in the private repository
    if: github.repository == 'csesumonpro/test'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Add public remote
        run: |
          git remote add public https://x-access-token:${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/csesumonpro/test-mirror.git

      - name: Force push to public release branch
        run: |
          git push public HEAD:release --force