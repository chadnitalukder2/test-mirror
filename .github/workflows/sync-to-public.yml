name: Sync Public Mirror

on:
  push:
    branches:
      - release

jobs:
  sync-public:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Create clean working directory
        run: |
          # Create a temporary branch without .github/workflows
          git checkout -b temp-sync-branch
          git rm -r --cached .github/workflows
          git commit -m "Remove .github/workflows directory [skip ci]" || true

      - name: Add public remote
        run: |
          git remote add public https://x-access-token:${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/csesumonpro/test-mirror.git

      - name: Force push to public release branch
        run: |
          git push public temp-sync-branch:release --force