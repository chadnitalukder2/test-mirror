name: Create Branch in Private Repo on PR

on:
  pull_request:
    types: [opened]

jobs:
  create-branch-in-private:
    runs-on: ubuntu-latest
    steps:
      - name: Get PR details
        id: pr_details
        run: |
          echo "source_branch=${{ github.event.pull_request.head.ref }}" >> $GITHUB_OUTPUT
          echo "source_sha=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
          echo "pr_number=${{ github.event.number }}" >> $GITHUB_OUTPUT

      - name: Create branch in private repo
        run: |
          # Clone the private repository
          git clone https://x-access-token:${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/csesumonpro/test.git private-repo
          cd private-repo
          
          # Create a new branch with the same name as the PR source branch
          BRANCH_NAME="pr/${{ steps.pr_details.outputs.source_branch }}"
          git checkout -b $BRANCH_NAME
          
          # Set the branch to the same commit as the PR
          git reset --hard ${{ steps.pr_details.outputs.source_sha }}
          
          # Push the new branch to the private repository
          git push origin $BRANCH_NAME
          
          echo "Created branch: $BRANCH_NAME in private repository"

      - name: Comment on PR
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ A branch has been created in the private repository for this PR: `pr/${{ steps.pr_details.outputs.source_branch }}`'
            })